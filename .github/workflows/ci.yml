name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for all jobs; no job needs write access.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 1.25.x is the minimum of go.mod, 1.27.x the supported current release
        go: [ '1.25.x', '1.26.x', '1.27.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: Determine Go module cache path
        id: go-cache
        shell: bash
        run: echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        # only on the current Go release: older releases no longer get
        # security fixes, so their standard library findings cannot be fixed
        if: matrix.go == '1.27.x'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Test
        run: go test ./... -v

  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Composer audit (root)
        run: |
          if [ -f composer.json ] && [ -f composer.lock ]; then
            package_count="$(php -r '$l=json_decode(file_get_contents("composer.lock"),true); echo count($l["packages"]??[])+count($l["packages-dev"]??[]);')"
            if [ "$package_count" -eq 0 ]; then
              echo "No Composer packages in root lock file; skipping audit."
            else
              composer audit --locked
            fi
          fi

      - name: Composer install and audit (php/)
        run: |
          if [ -f php/composer.json ]; then
            cd php && composer install --no-interaction --prefer-dist --no-progress && composer audit --locked
          fi

      - name: PHPUnit (php/)
        run: |
          if [ -f php/composer.json ] && [ -d php/vendor/bin ]; then
            cd php && ./vendor/bin/phpunit
          fi
